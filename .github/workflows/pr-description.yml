name: PR Description

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-description-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  write-description:
    if: ${{ !github.event.pull_request.draft && secrets.OPENAI_API_KEY != '' }}
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
    steps:
      - name: Generate PR description
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const MAX_FILES = 40;
            const MAX_PATCH_CHARS_PER_FILE = 2500;
            const MAX_TOTAL_PATCH_CHARS = 18000;
            let totalPatchChars = 0;

            const fileSummaries = files.slice(0, MAX_FILES).map((file) => {
              let patch = file.patch ?? "";
              if (patch.length > MAX_PATCH_CHARS_PER_FILE) {
                patch = `${patch.slice(0, MAX_PATCH_CHARS_PER_FILE)}\n... [truncated]`;
              }

              if (totalPatchChars >= MAX_TOTAL_PATCH_CHARS) {
                patch = "[omitted: patch budget exceeded]";
              } else if (totalPatchChars + patch.length > MAX_TOTAL_PATCH_CHARS) {
                const remaining = MAX_TOTAL_PATCH_CHARS - totalPatchChars;
                patch = `${patch.slice(0, Math.max(0, remaining))}\n... [truncated]`;
                totalPatchChars = MAX_TOTAL_PATCH_CHARS;
              } else {
                totalPatchChars += patch.length;
              }

              return [
                `File: ${file.filename}`,
                `Status: ${file.status}`,
                `Additions: ${file.additions}, Deletions: ${file.deletions}`,
                "Patch:",
                patch || "[no patch available]",
              ].join("\n");
            });

            const changedFilesList = files
              .slice(0, 100)
              .map((file) => `- ${file.filename} (${file.status}, +${file.additions}/-${file.deletions})`)
              .join("\n");

            const prompt = [
              `Repository: ${owner}/${repo}`,
              `PR title: ${pr.title}`,
              `Base branch: ${pr.base.ref}`,
              `Head branch: ${pr.head.ref}`,
              "",
              "Changed files:",
              changedFilesList || "- No changed files reported",
              "",
              "Selected patches:",
              fileSummaries.join("\n\n"),
              "",
              "Write a concise pull request description in GitHub-flavored Markdown.",
              "Requirements:",
              "- Use these sections exactly: ## Summary, ## Changes, ## Risks, ## Testing.",
              "- Keep it factual and specific to the diff.",
              "- In Changes, use flat bullets.",
              "- In Risks, call out real uncertainty only; if none, say `- None identified.`",
              "- In Testing, do not claim tests were run unless the diff clearly shows that.",
              "- Do not mention OpenAI, prompts, or that the text was AI-generated.",
              "- Keep the overall description compact.",
            ].join("\n");

            const response = await fetch("https://api.openai.com/v1/responses", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${process.env.OPENAI_API_KEY}`,
              },
              body: JSON.stringify({
                model: process.env.OPENAI_MODEL,
                instructions: "You write accurate engineering pull request descriptions from git diffs.",
                input: prompt,
                max_output_tokens: 900,
                store: false,
              }),
            });

            if (!response.ok) {
              const errorText = await response.text();
              core.setFailed(`OpenAI API request failed (${response.status}): ${errorText}`);
              return;
            }

            const payload = await response.json();
            const generated = (payload.output || [])
              .flatMap((item) => item.content || [])
              .filter((item) => item.type === "output_text")
              .map((item) => item.text)
              .join("\n")
              .trim();

            if (!generated) {
              core.setFailed("OpenAI API returned an empty PR description.");
              return;
            }

            const startMarker = "<!-- pr-description:start -->";
            const endMarker = "<!-- pr-description:end -->";
            const managedBlock = `${startMarker}\n${generated}\n${endMarker}`;
            const currentBody = pr.body?.trim() || "";

            const shouldReplaceEntireBody = context.payload.action === "opened";

            let nextBody;
            if (shouldReplaceEntireBody) {
              nextBody = managedBlock;
            } else if (currentBody.includes(startMarker) && currentBody.includes(endMarker)) {
              nextBody = currentBody.replace(
                new RegExp(`${startMarker}[\\s\\S]*?${endMarker}`),
                managedBlock,
              );
            } else if (currentBody.length > 0) {
              nextBody = `${managedBlock}\n\n${currentBody}`;
            } else {
              nextBody = managedBlock;
            }

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: pr.number,
              body: nextBody,
            });
